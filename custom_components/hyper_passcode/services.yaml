submit:
  fields:
    scope_id:
      required: true
      example: 9f2c1b7e4a6d4c0f8b3e5a7d9c1f2e40
      selector:
        text:
    code:
      required: true
      example: "495162"
      selector:
        text:

submit_key:
  fields:
    keypad_id:
      required: true
      selector:
        text:
    key:
      required: true
      example: "7"
      selector:
        text:

clear_buffer:
  fields:
    keypad_id:
      required: true
      selector:
        text:

test_code:
  fields:
    scope_id:
      required: true
      selector:
        text:
    code:
      required: true
      selector:
        text:

create_code:
  fields:
    label:
      required: true
      example: Cleaner
      selector:
        text:
    code:
      example: "495162"
      selector:
        text:
    scope_ids:
      selector:
        text:
          multiple: true
    length:
      selector:
        number:
          min: 1
          max: 64
          mode: box
    code_type:
      default: pin
      selector:
        select:
          options: [pin, alphanumeric]
    keep_viewable:
      default: false
      selector:
        boolean:
    owner:
      selector:
        entity:
          filter:
            domain: person
    notes:
      selector:
        text:
          multiline: true
    valid_from:
      selector:
        datetime:
    valid_until:
      selector:
        datetime:
    schedule_entities:
      selector:
        entity:
          multiple: true
          filter:
            domain: schedule
    condition_entities:
      selector:
        entity:
          multiple: true
          filter:
            domain: [binary_sensor, switch, input_boolean, calendar, schedule]
    max_uses:
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    uses_per_hour:
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    uses_per_day:
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    cooldown_seconds:
      selector:
        number:
          min: 0
          max: 86400
          mode: box
    grace_period_seconds:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    grace_mode:
      default: fixed
      selector:
        select:
          options:
            - value: fixed
              label: Fixed -- runs from the use that was counted, and does not extend
            - value: sliding
              label: Sliding -- every re-entry restarts the window

create_otp:
  fields:
    scope_id:
      required: true
      selector:
        text:
    label:
      default: One-time code
      selector:
        text:
    valid_from:
      selector:
        datetime:
    valid_until:
      selector:
        datetime:
    duration:
      example: "02:00:00"
      selector:
        duration:
    max_uses:
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    grace_period_seconds:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    length:
      selector:
        number:
          min: 1
          max: 64
          mode: box
    keep_viewable:
      default: true
      selector:
        boolean:

revoke:
  fields:
    credential_id:
      required: true
      selector:
        text:

update_code:
  fields:
    credential_id:
      required: true
      selector:
        text:
    label:
      selector:
        text:
    code:
      example: "495162"
      selector:
        text:
    scope_ids:
      selector:
        text:
          multiple: true
    keep_viewable:
      selector:
        boolean:
    owner:
      selector:
        entity:
          filter:
            domain: person
    notes:
      selector:
        text:
          multiline: true
    valid_from:
      selector:
        datetime:
    valid_until:
      selector:
        datetime:
    schedule_entities:
      selector:
        entity:
          multiple: true
          filter:
            domain: schedule
    condition_entities:
      selector:
        entity:
          multiple: true
          filter:
            domain: [binary_sensor, switch, input_boolean, calendar, schedule]
    max_uses:
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    uses_per_hour:
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    uses_per_day:
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    cooldown_seconds:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    grace_period_seconds:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    # No default: a services.yaml default pre-fills the field, which then gets sent,
    # which would reset the mode on every update driven from the UI.
    grace_mode:
      selector:
        select:
          options:
            - value: fixed
              label: Fixed -- runs from the use that was counted, and does not extend
            - value: sliding
              label: Sliding -- every re-entry restarts the window

